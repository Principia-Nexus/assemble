# Publishes the one Assemble image (infra/assemble.Dockerfile) to GitHub Container Registry on every push to main.
# It deploys nothing: a host pulls ghcr.io/principia-nexus/assemble and supplies the settings in apps/api/.env.example.
name: image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/principia-nexus/assemble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f infra/assemble.Dockerfile -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:main" .
      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:main"
